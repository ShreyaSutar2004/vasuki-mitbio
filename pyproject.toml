[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vasuki-mitbio"
version = "1.2.0"
description = "VASUKI: An Automated GUI for Comparative Protein Modeling"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Ms.Shreya Sutar"}, {name = "Dr.K V Swamy"}
]
keywords = ["vasuki", "protein modeling", "bioinformatics", "homology modeling", "BLAST", "PyQt5", "ramachandran", "MODELLER"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Pytshon :: 3.11",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

dependencies = [
  "setuptools==69.5.1",
  "PyQt5>=5.15.4",
  "modeller",
  "biopython",
  "requests",
  "langchain",
  "transformers",
  "huggingface-hub",
  "PyQtWebEngine",
  "python-dotenv",
  "pandas",
  "ramplot"
]

[project.scripts]
run-vasuki = "vasuki.main:main"
vasuki-chat = "vasuki.chatmodel:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
vasuki = ["*.html", "Images/*.png"]

[tool.setuptools.packages.find]
include = ["vasuki*"]